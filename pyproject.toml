[project]
name = "supervision"
authors = [{ name = "Altoplano", email = "soporte@altoplano.com" }]
description = "Supervisión de obras de infraestructura hidráulica (estatal y federal)"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
